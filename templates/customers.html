{% extends "base.html" %}

{% block content %}
<div class="row align-items-center mb-4">
    <div class="col">
        <h2 class="fw-bold">Customers</h2>
    </div>
</div>

<!-- Add Customer Card -->
<div class="erp-card shadow-sm mb-4">
    <h5 class="mb-3">Add New Customer</h5>
    <form method="POST" action="/customers" class="row g-3 align-items-end">
        <div class="col-md-5">
            <label for="name" class="form-label">Name <span class="text-danger">*</span></label>
            <input type="text" name="name" class="form-control" placeholder="John Doe" required>
        </div>
        <div class="col-md-5">
            <label for="contact_info" class="form-label">Contact Info</label>
            <input type="text" name="contact_info" class="form-control" placeholder="Phone or Email">
        </div>
        <div class="col-md-2">
            <button type="submit" class="btn btn-primary w-100">Add Customer</button>
        </div>
    </form>
</div>

<!-- Customers Table -->
<div class="erp-card shadow-sm">
    <table class="table table-hover align-middle">
        <thead class="table-dark">
            <tr>
                <th>PID</th>
                <th>Name</th>
                <th>Contact Info</th>
                <th class="text-center">Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for customer in customers %}
            <tr>
                <td>{{ customer.pid }}</td>
                <td class="fw-bold">{{ customer.name }}</td>
                <td>{{ customer.contact_info or 'N/A' }}</td>
                <td class="text-center">
                    <!-- Button trigger modal for Editing -->
                    <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#editModal{{ customer.pid }}">
                        Edit
                    </button>
                </td>
            </tr>

            <!-- Edit Customer Modal -->
            <div class="modal fade" id="editModal{{ customer.pid }}" tabindex="-1" aria-hidden="true">
              <div class="modal-dialog">
                <div class="modal-content">
                  <form method="POST" action="/customers/edit/{{ customer.pid }}">
                      <div class="modal-header bg-light">
                        <h5 class="modal-title">Edit Customer: {{ customer.name }}</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                      </div>
                      <div class="modal-body">
                          <div class="mb-3">
                             <label class="form-label">Customer Name</label>
                                 <input type="text" name="name" class="form-control" pattern="[A-Za-z\s]+" title="Letters and spaces only" required>
                          </div>
                            <div class="mb-3">
                                <label class="form-label">Contact Info</label>
                                <input type="text" name="contact_info" class="form-control" minlength="10" title="Must be at least 10 characters long" required>
                            </div>
                      </div>
                      <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-success">Save Changes</button>
                      </div>
                  </form>
                </div>
              </div>
            </div>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
