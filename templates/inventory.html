{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
  <h2 class="mb-4">Inventory</h2>

  <!-- Product form -->
  <form method="POST" action="/inventory" class="card p-3 mb-4 shadow-sm">
    <div class="mb-3">
      <label for="name" class="form-label">Product Name</label>
      <input type="text" id="name" name="name" class="form-control" required>
    </div>

    <div class="mb-3">
      <label for="purchase_price" class="form-label">Purchase Price</label>
      <input type="number" id="purchase_price" name="purchase_price" step="0.01" class="form-control" required>
    </div>

    <div class="mb-3">
      <label for="selling_price" class="form-label">Selling Price</label>
      <input type="number" id="selling_price" name="selling_price" step="0.01" class="form-control" required>
    </div>

    <div class="mb-3">
      <label for="stock" class="form-label">Stock Quantity</label>
      <input type="number" id="stock" name="stock" class="form-control" required>
    </div>

    <button type="submit" class="btn btn-primary">Add Product</button>
  </form>

  <!-- Product table -->
  <h3 class="mb-3">All Products</h3>
  <table class="table table-striped table-bordered shadow-sm">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Purchase Price</th>
        <th>Selling Price</th>
        <th>Stock</th>
      </tr>
    </thead>
    <tbody>
      {% for product in products %}
      <tr>
        <td>{{ product.id }}</td>
        <td>{{ product.name }}</td>
        <td>{{ product.purchase_price }}</td>
        <td>{{ product.selling_price }}</td>
        <td>{{ product.stock }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
